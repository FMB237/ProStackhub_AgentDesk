name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ProStackhub_AgentDesk/ProStackhub_AgentDesk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run health check test
        env:
          GEMINI_API_KEY: dummy
        run: |
          pytest tests/ -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ProStackhub_AgentDesk/ProStackhub_AgentDesk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t agentdesk:test .
          docker run --rm agentdesk:test python -c "import main; print('Import OK')"
