version: "3.9"

services:
  agentdesk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentdesk
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount static for live reload during dev
      - ./static:/app/static
      - ./main.py:/app/main.py
      - ./agent.py:/app/agent.py
      - ./utils.py:/app/utils.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
